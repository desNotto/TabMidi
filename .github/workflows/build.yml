name: Build VST3 (Windows + macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target TabMidi_VST3 TabMidi_Standalone --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: TabMidi-VST3-Windows
          path: build/TabMidi_artefacts/Release/VST3
      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: TabMidi-Standalone-Windows
          path: build/TabMidi_artefacts/Release/Standalone

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal build for Apple Silicon and Intel)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Build
        run: cmake --build build --config Release --target TabMidi_VST3 TabMidi_Standalone --parallel
      - name: Sign (ad hoc) and pack
        run: |
          cd build/TabMidi_artefacts/Release
          codesign --force --deep --sign - VST3/TabMidi.vst3
          codesign --force --deep --sign - Standalone/TabMidi.app
          ditto -c -k --sequesterRsrc --keepParent VST3/TabMidi.vst3 TabMidi-VST3-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent Standalone/TabMidi.app TabMidi-Standalone-macOS.zip
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: TabMidi-VST3-macOS
          path: build/TabMidi_artefacts/Release/TabMidi-VST3-macOS.zip
      - name: Upload standalone app
        uses: actions/upload-artifact@v4
        with:
          name: TabMidi-Standalone-macOS
          path: build/TabMidi_artefacts/Release/TabMidi-Standalone-macOS.zip
